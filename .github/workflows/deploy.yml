# Publica o jogo no GitHub Pages automaticamente a cada push na branch "main".
# Roda nos computadores do próprio GitHub: instala as dependências, faz o
# "npm run build" e publica a pasta dist/.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes acontecerem seguidos, só o mais recente é publicado
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Node usado para o build do jogo
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
